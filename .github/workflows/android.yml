name: Verify frozen Futoon v0.8.4 artifacts
on:
  push:
    branches: [verify-channel-shortcuts-v084]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install signature verification dependency
        run: python3 -m pip install cryptography==46.0.3
      - name: Verify build artifacts, regression reports, APK signature and identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/verify_channel_artifacts.py
      - name: Upload verified APK and result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SMS-Futoon-v0.8.4-verified-arm64
          path: verification/*
          if-no-files-found: error
          retention-days: 30
